<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">
  <!-- スマートフォンで画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eijasfarhan のポートフォリオ</title>
  <style>
    /* ===== 色の設定（レトロゲーム風） ===== */
    :root {
      --bg-color: #1b1b3a;      /* ページの背景色（深い紺色） */
      --box-color: #000000;     /* ウィンドウの背景色（黒） */
      --border-color: #ffffff;  /* ウィンドウの枠線（白） */
      --text-color: #ffffff;    /* 文字の色（白） */
      --yellow: #ffd23f;        /* 強調色（黄色） */
      --green: #3bceac;         /* 強調色（緑） */
      --pink: #ee4266;          /* 強調色（ピンク） */
    }

    /* ===== ページ全体の基本設定 ===== */
    * {
      box-sizing: border-box; /* 余白を含めてサイズを計算する */
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      /* 背景に細かいドット模様をつけて，ゲーム画面っぽくする */
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 8px 8px;
      color: var(--text-color);
      font-family: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace; /* 等幅フォントでドット感を出す */
      line-height: 1.8;
      padding: 32px 16px;
    }

    /* ===== 中央にまとめるための入れ物 ===== */
    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ===== ゲームのウィンドウ風の箱 ===== */
    .window {
      background-color: var(--box-color);
      border: 4px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.6); /* 影をずらして，ドット絵っぽい立体感を出す */
      padding: 24px;
      margin-bottom: 28px;
    }

    /* ===== タイトル画面（名前とキャッチコピー） ===== */
    .title-screen {
      text-align: center;
      padding: 40px 24px;
    }

    .press-start {
      color: var(--green);
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .name {
      font-size: 2.2rem;
      color: var(--yellow);
      text-shadow: 4px 4px 0 var(--pink); /* ずらした影で，レトロなロゴ風にする */
      word-break: break-all;   /* 長い名前でもはみ出さないようにする */
    }

    .catch {
      margin-top: 20px;
      font-size: 1.05rem;
    }

    /* ===== ステータス画面（基本情報） ===== */
    .status {
      list-style: none;
    }

    .status li {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px dashed #444; /* 点線で項目を区切る */
      padding: 8px 0;
    }

    .status .label {
      color: var(--green);
    }

    /* ===== セクションの見出し ===== */
    h2 {
      font-size: 1.1rem;
      color: var(--yellow);
      margin-bottom: 16px;
    }

    /* 見出しの前に「▶」をつけて，ゲームのメニュー風にする */
    h2::before {
      content: "▶ ";
      color: var(--pink);
    }

    /* ===== アイテム一覧（趣味・プログラミング経験） ===== */
    .items {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); /* 画面幅に合わせて自動で並べる */
      gap: 12px;
    }

    .items li {
      border: 2px solid var(--border-color);
      padding: 10px;
      text-align: center;
    }

    /* アイテムの前に「★」をつける */
    .items li::before {
      content: "★ ";
      color: var(--yellow);
    }

    /* ===== セリフ風のメッセージ ===== */
    .message {
      font-size: 1.05rem;
    }

    /* メッセージの最後に「▼」をつけて，会話の続きがあるように見せる */
    .message::after {
      content: " ▼";
      color: var(--green);
    }

    /* ===== 最後のひとこと ===== */
    .last-word {
      font-size: 1.3rem;
      color: var(--yellow);
      text-align: center;
    }

    /* ===== フッター ===== */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #aaaaaa;
      margin-top: 12px;
    }

    /* ===== スマートフォン向けの調整（画面幅600px以下） ===== */
    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }
      .name {
        font-size: 1.7rem;
      }
      .window {
        padding: 18px;
      }
      .items {
        grid-template-columns: repeat(2, 1fr); /* スマホでは2列にする */
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ===== タイトル画面：名前とキャッチコピー ===== -->
    <header class="window title-screen">
      <p class="press-start">PLAYER 1</p>
      <h1 class="name">eijasfarhan</h1>
      <p class="catch">毎日バレーボールをやってほしい</p>
    </header>

    <main>
      <!-- ===== ステータス：基本情報 ===== -->
      <section class="window">
        <h2>ステータス</h2>
        <ul class="status">
          <li><span class="label">なまえ</span><span>eijasfarhan</span></li>
          <li><span class="label">がくねん</span><span>4年</span></li>
          <li><span class="label">しょぞく</span><span>拓殖大学工学部</span></li>
        </ul>
      </section>

      <!-- ===== 趣味・好きなこと ===== -->
      <section class="window">
        <h2>趣味・好きなこと</h2>
        <ul class="items">
          <li>ゲーム</li>
          <li>バレーボール</li>
          <li>寝る</li>
        </ul>
      </section>

      <!-- ===== プログラミング経験 ===== -->
      <section class="window">
        <h2>プログラミング経験</h2>
        <ul class="items">
          <li>Python</li>
          <li>Java</li>
          <li>C++</li>
          <li>C</li>
        </ul>
      </section>

      <!-- ===== この授業で学びたいこと ===== -->
      <section class="window">
        <h2>この授業で学びたいこと</h2>
        <p class="message">OSS と GitHub について学びたいです</p>
      </section>

      <!-- ===== ひとこと ===== -->
      <section class="window">
        <h2>ひとこと</h2>
        <p class="last-word">全部のこと、最後までやろ</p>
      </section>
    </main>

    <!-- ===== フッター ===== -->
    <footer>
      <p>&copy; eijasfarhan</p>
    </footer>

  </div>
</body>
</html>
